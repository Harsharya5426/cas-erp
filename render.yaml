services:
  - type: web
    name: cas-erp-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@cas-erp/shared && npm run build --workspace=@cas-erp/api
    startCommand: npm run start --workspace=@cas-erp/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
